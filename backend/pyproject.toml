[project]
name = "chinese-object-detector-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "transformers>=4.38.0",
    "scipy>=1.11.0",
    "pillow>=10.2.0",
    "httpx>=0.27.0",
    "edge-tts==7.3.1",
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
